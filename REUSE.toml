version = 1
SPDX-PackageName = "Virtual Acoustic Object (VAO) Standard"
SPDX-PackageDownloadLocation = "https://github.com/modavis-project/vao-standard"

[[annotations]]
path = ["Docs/**", "Schemas/**", "Fixtures/**", "knowledge/**", "**.md", "CITATION.cff", "codemeta.json", ".zenodo.json", "VERSION", "NOTICE", "LICENSE"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Dominik Ukolov and contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["Tools/**", "w3id/.htaccess", "tests/**", ".github/**", "pyproject.toml", "requirements-dev.txt", "requirements-lock.txt", ".editorconfig", ".gitattributes", ".gitignore", "REUSE.toml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Dominik Ukolov and contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["Profiles/**/*.json", "Profiles/**/*.jsonld", "Profiles/**/*.ttl", "Profiles/**/*.md", "Profiles/**/*.cff"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Dominik Ukolov and contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["Profiles/**/__init__.py"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Dominik Ukolov and contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["Fixtures/MMIC/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Dominik Ukolov and contributors"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["Fixtures/MMIC/**/payload/reference.py", "Fixtures/MMIC/**/payload/requirements-lock.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Dominik Ukolov and contributors"
SPDX-License-Identifier = "Apache-2.0"
