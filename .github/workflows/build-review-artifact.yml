name: Verify source artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-lock.txt
      - run: python Tools/check_release.py
      - run: python Tools/build_release.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vao-standard-source
          path: |
            build/*.zip
            build/*.sha256
          if-no-files-found: error
          retention-days: 14

      # Deliberately no GitHub Release, tag, registry, DOI, W3ID, or deploy step.
