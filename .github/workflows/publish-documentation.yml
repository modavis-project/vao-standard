name: Publish VAO routing note

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-vao-0.6.0
  cancel-in-progress: false

jobs:
  pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build the VAO 0.6.0 site
        run: |
          VAO_RELEASE_TAG=refs/tags/v0.6.0
          test "$(git rev-parse "$VAO_RELEASE_TAG")" = 5875c37cc4fcf9e6dbf788be39accc8b019240b5
          test "$(git rev-parse "$VAO_RELEASE_TAG^{commit}")" = 9d477213eab90defa75bef0f44e0d292a83e68d9
          git worktree add --detach "$RUNNER_TEMP/vao-tag" "$VAO_RELEASE_TAG"
          python "$RUNNER_TEMP/vao-tag/Tools/build_site.py" --output "$RUNNER_TEMP/vao-site" --publication-state published
          python "$RUNNER_TEMP/vao-tag/Tools/check_site.py" --site "$RUNNER_TEMP/vao-site" --publication-state published
      - name: Update the routing note and verify the site
        run: |
          python Tools/update_published_routing.py "$RUNNER_TEMP/vao-site"
          python "$RUNNER_TEMP/vao-tag/Tools/check_site.py" --site "$RUNNER_TEMP/vao-site" --publication-state published
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/vao-site
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
